# PostgreSQL de DESARROLLO y de pruebas. No es el despliegue (eso llega en una spec posterior).
# Las variables salen del archivo .env de la raíz; si falta alguna, Compose se detiene y la nombra.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD en .env}
      OWNER_PASSWORD: ${OWNER_PASSWORD:?defina OWNER_PASSWORD en .env}
      WRITER_PASSWORD: ${WRITER_PASSWORD:?defina WRITER_PASSWORD en .env}
      READER_PASSWORD: ${READER_PASSWORD:?defina READER_PASSWORD en .env}
      DB_NAME: ${DB_NAME:?defina DB_NAME en .env}
      DB_NAME_TEST: ${DB_NAME_TEST:?defina DB_NAME_TEST en .env}
    ports:
      # Solo en la máquina local: nunca se publica hacia la red.
      - "127.0.0.1:${DB_LOCAL_PORT:?defina DB_LOCAL_PORT en .env}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # El script se ejecuta solo la primera vez, con el volumen vacío.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Por TCP: el servidor temporal del arranque inicial solo escucha en el socket local.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER}"]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  pgdata:
